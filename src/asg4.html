<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="utf-8" />
	<title>Cube World Derek Simpson dejsimps</title>
	<style>
		body { font-family: sans-serif; margin: 10px; }
		#controls { margin-top: 10px; max-width: 600px; }
		#controls button { margin: 3px 5px 3px 0; padding: 5px 10px; cursor: pointer; }
		#controls label { display: inline-block; width: 85px; }
		.slider-row { margin: 4px 0; }
		.slider-row input[type="range"] { width: 200px; vertical-align: middle; }
		.slider-row span { display: inline-block; width: 40px; text-align: right; }
		hr { margin: 8px 0; }
	</style>
  </head>

  <body onload="main()" oncontextmenu="return false;">
	<canvas id="webgl" width="500" height="500">
	Please use a browser that supports "canvas"
	</canvas>

	<br>
	<span id="fpsCounter"></span>

	<div id="controls">
		<button id="btnNormalVis" onclick="toggleNormalVis()">Normal Vis: OFF</button>
		<button id="btnLighting" onclick="toggleLighting()">Lighting: ON</button>
		<button id="btnSpotlight" onclick="toggleSpotlight()">Spotlight: OFF</button>
		<button id="btnAnimLight" onclick="toggleAnimLight()">Animate Light: ON</button>
		<hr>

		<b>Light Position</b>
		<div class="slider-row">
			<label>Light X:</label>
			<input type="range" id="lightX" min="-10" max="10" step="0.1" value="3" oninput="onLightSlider()">
			<span id="lightXVal">3</span>
		</div>
		<div class="slider-row">
			<label>Light Y:</label>
			<input type="range" id="lightY" min="-5" max="15" step="0.1" value="5" oninput="onLightSlider()">
			<span id="lightYVal">5</span>
		</div>
		<div class="slider-row">
			<label>Light Z:</label>
			<input type="range" id="lightZ" min="-10" max="10" step="0.1" value="3" oninput="onLightSlider()">
			<span id="lightZVal">3</span>
		</div>
		<hr>

		<b>Light Color</b>
		<div class="slider-row">
			<label>Red:</label>
			<input type="range" id="lightR" min="0" max="1" step="0.01" value="1" oninput="onLightColorSlider()">
			<span id="lightRVal">1</span>
		</div>
		<div class="slider-row">
			<label>Green:</label>
			<input type="range" id="lightG" min="0" max="1" step="0.01" value="1" oninput="onLightColorSlider()">
			<span id="lightGVal">1</span>
		</div>
		<div class="slider-row">
			<label>Blue:</label>
			<input type="range" id="lightB" min="0" max="1" step="0.01" value="1" oninput="onLightColorSlider()">
			<span id="lightBVal">1</span>
		</div>
	</div>

	<script src="../lib/cuon-matrix-cse160.js"></script>
	<script src="../lib/cuon-utils.js"></script>
	<script src="../lib/webgl-utils.js"></script>
	<script src="../lib/webgl-debug.js"></script>
	<script src="triangle.js"></script>
	<script src="cube.js"></script>
	<script src="sphere.js"></script>
	<script src="objmodel.js"></script>
	<script src="kingpig.js"></script>
	<script src="camera.js"></script>
	<script src="asg4.js"></script>
  </body>
</html>
